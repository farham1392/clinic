{% load i18n %}{% if messages %}
<div class="messages" role="status" aria-live="polite">
  {% for message in messages %}
  <div class="alert alert-{{ message.tags|default:'info' }}">
    <i class="lead fa-solid {% if message.tags == 'success' %}fa-circle-check{% elif message.tags == 'danger' %}fa-circle-exclamation{% elif message.tags == 'warning' %}fa-triangle-exclamation{% else %}fa-circle-info{% endif %}"></i>
    <span>{{ message }}</span>
    <button type="button" class="close" aria-label="{% translate "Dismiss" %}"><i class="fa-solid fa-xmark"></i></button>
  </div>
  {% endfor %}
</div>
{% endif %}
